<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Cookie Catcher - Tap the Falling Cookies!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>🍪 Cookie Catcher!</h1>
            <p>Tap the falling cookies before they hit the ground!</p>
            <p class="instructions">You have 3 lives. Speed increases over time!</p>

            <!-- Name Input -->
            <div class="name-input-container">
                <input
                    type="text"
                    id="player-name"
                    class="name-input"
                    placeholder="Enter your name"
                    maxlength="15"
                    autocomplete="off"
                />
            </div>

            <button id="start-button" class="mario-button">START GAME</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <!-- Score and Lives HUD -->
            <div id="hud">
                <div class="hud-item">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">LIVES</span>
                    <span id="lives" class="value">
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                    </span>
                </div>
                <div class="hud-item">
                    <span class="label">LEVEL</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>

            <!-- Author Credit -->
            <div class="author-credit">author: Assylzat</div>

            <!-- Game Canvas -->
            <div id="game-area">
                <!-- Trash Can -->
                <div class="trash-can">
                    <div class="trash-lid"></div>
                    <div class="trash-body"></div>
                </div>
                <!-- Cookies will be spawned here dynamically -->
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1>GAME OVER!</h1>
            <p id="player-name-display" class="player-name-display"></p>
            <div class="final-stats">
                <p>Final Score: <span id="final-score" class="highlight">0</span></p>
                <p>Level Reached: <span id="final-level" class="highlight">1</span></p>
            </div>
            <button id="restart-button" class="mario-button">PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
